[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "g1-active-view"
version = "0.1.0"
description = "Offline visual-action inference package for the G1 active-view policy"
requires-python = ">=3.10,<3.13"
dependencies = ["numpy==1.26.4", "Pillow>=10,<12", "opencv-python-headless>=4.8,<5", "torch>=2.0,<3"]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = "-q"
